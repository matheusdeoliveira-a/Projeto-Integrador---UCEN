/* ==========================================================

/* ------------------------------------------------------------------
   CELULAR / TABLET DE TOQUE: tudo centralizado, só as boxes.
   Vale só para janelas até 756px ou para aparelhos cuja TELA física tem
   até 900px (max-device-width), o que cobre também o "Site para computador"
   do Chrome do celular. Monitores e notebooks não são afetados.
   A frase e a linha somem; logo, formulário e botão Sair ficam
   alinhados no centro.
   ------------------------------------------------------------------ */
@media (max-width: 756px), (max-device-width: 900px) {

    html, body {
        overflow-x: hidden;
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        min-height: 100svh;
    }

    /* Cabeçalho entra no fluxo (antes ficava solto por cima) e centraliza */
    header {
        position: static;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 22px 20px 0;
    }

    .logo-login {
        width: 90px;
        display: block;
    }

    .botao-sair {
        width: 140px;
        height: 44px;
        font-size: 15px;
    }

    /* Frase e linha saem do responsivo */
    .lado-esquerdo,
    .ftan-frase,
    .linha-login {
        display: none;
    }

    /* Área do formulário: centralizada na horizontal e na vertical */
    .tela-login {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 420px;
        margin: auto;
        padding: 24px 20px 40px;
        gap: 0;
    }

    .lado-direito {
        width: 100%;
        align-items: center;
        gap: 20px;
    }

    .titulo-login {
        font-size: 32px;
        margin-bottom: 6px;
    }

    /* Tudo com a mesma largura, centralizado */
    .campo-com-erro,
    .campo-senha,
    .erro-geral,
    .aviso-codigo,
    .esqueci-senha,
    .separador,
    .botao-logar,
    .botao-social,
    #painelSenha,
    #painelCodigo,
    input {
        width: 100%;
        max-width: 360px;
    }

    #painelSenha {
        gap: 22px;
    }

    /* 16px evita o zoom automático do iPhone ao tocar no campo */
    input {
        font-size: 16px;
        padding: 14px 12px;
    }

    .campo-senha input {
        padding: 14px 45px;
    }

    .campo-codigo input {
        font-size: 22px;
        letter-spacing: 8px;
    }

    .botao-social {
        height: 48px;
        font-size: 15px;
    }

    .esqueci-senha {
        font-size: 14px;
    }

    .olho {
        padding: 10px;
        right: 5px;
    }

    .toast-sucesso {
        left: 16px;
        right: 16px;
        bottom: 16px;
        max-width: none;
    }
}

/* Celulares bem pequenos */
@media (max-width: 380px) {
    header {
        padding: 18px 14px 0;
    }
    .tela-login {
        padding: 20px 14px 32px;
    }
    .titulo-login {
        font-size: 26px;
    }
    .campo-codigo input {
        font-size: 20px;
        letter-spacing: 6px;
    }
}

<script>

// Código de olho
const senha = document.getElementById("senha");
const olho = document.getElementById("icone-olho");

olho.addEventListener("click", function(){

    if(senha.type === "password"){

        senha.type = "text";

        olho.innerHTML = '<i class="fa-regular fa-eye-slash"></i>';

    }else{

        senha.type = "password";

        olho.innerHTML = '<i class="fa-regular fa-eye"></i>';
    }

});



// ==========================================================
// LOGIN (com senha ou por código), tudo via fetch, sem sair da pagina
// em caso de erro
// ==========================================================

const formLogin = document.getElementById("formLogin");
const campoUsuario = document.getElementById("usuario");
const campoSenha = document.getElementById("senha");
const campoCodigo = document.getElementById("codigo");

const painelSenha = document.getElementById("painelSenha");
const painelCodigo = document.getElementById("painelCodigo");

const botaoLogar = document.getElementById("botaoLogar");
const botaoReceberCodigo = document.getElementById("botaoReceberCodigo");
const botaoVerificarCodigo = document.getElementById("botaoVerificarCodigo");
const botaoReenviar = document.getElementById("botaoReenviar");
const linkReenviar = document.getElementById("linkReenviar");
const linkVoltarSenha = document.getElementById("linkVoltarSenha");

const erroGeral = document.getElementById("erroGeral");
const avisoCodigo = document.getElementById("avisoCodigo");
const toastSucesso = document.getElementById("toastSucesso");
const toastTexto = document.getElementById("toastTexto");

const camposComErro = {
    usuario: document.getElementById("erroUsuario"),
    senha: document.getElementById("erroSenha"),
    codigo: document.getElementById("erroCodigo")
};

// ==========================================================
// NOVO: destino depois do login.
// Antes era a URL fixa "http://localhost/Matheus/aaaaaaaaaaaaa/Nebula/portal_aluno.php"
// (URL_PORTAL_ALUNO), que quebraria na EC2. Agora é um caminho relativo,
// que funciona no XAMPP e no servidor. Quem recebe esse valor é a
// tela de carregamento (parâmetro ?destino=).
// ==========================================================
const DESTINO_PORTAL_ALUNO = "aluno_inicio.html"; // NOVO: página inicial do aluno (antes: portal_aluno.php). Serve de reserva se o PHP não mandar destino.

let segundosParaReenviar = 0;
let temporizadorReenvio = null;

function limparErros() {

    erroGeral.textContent = "";
    erroGeral.classList.remove("visivel");
    avisoCodigo.classList.remove("visivel");

    Object.values(camposComErro).forEach((span) => {
        span.textContent = "";
        span.classList.remove("visivel");
    });

    [campoUsuario, campoSenha, campoCodigo].forEach((input) => {
        if (input) input.classList.remove("campo-invalido");
    });

}

function mostrarErro(mensagem, campo) {

    if (campo && camposComErro[campo]) {

        camposComErro[campo].textContent = mensagem;
        camposComErro[campo].classList.add("visivel");

        const input = document.getElementById(campo);
        if (input) input.classList.add("campo-invalido");

    } else {

        erroGeral.textContent = mensagem;
        erroGeral.classList.add("visivel");

    }

}

// NOVO: recebe o destino que o PHP devolveu (aluno, professor ou suporte).
// Se não vier nada (ex.: login por código de e-mail, só de alunos), usa o do aluno.
function mostrarToastERedirecionar(destino) {

    destino = destino || DESTINO_PORTAL_ALUNO;

    toastSucesso.classList.add("visivel");

    // NOVO: em vez de ir direto ao portal, passa pela mesma tela de carregamento
    // usada no cadastro. O encodeURIComponent protege o valor dentro da URL.
    setTimeout(() => {
        window.location.href = "tela-de-carregamento.html?destino=" + encodeURIComponent(destino);
    }, 1400);

}

// ----- Alternar entre os dois painéis (senha / código) -----

function abrirPainelCodigo() {

    limparErros();
    painelSenha.classList.add("escondido");
    painelCodigo.classList.add("visivel");
    campoCodigo.value = "";
    campoCodigo.focus();

}

function abrirPainelSenha() {

    limparErros();
    painelCodigo.classList.remove("visivel");
    painelSenha.classList.remove("escondido");
    pararContagemReenvio();

}

linkVoltarSenha.addEventListener("click", (evento) => {
    evento.preventDefault();
    abrirPainelSenha();
});

// ----- Contagem regressiva do "Reenviar código" -----

function iniciarContagemReenvio() {

    segundosParaReenviar = 60;
    atualizarBotaoReenviar();

    temporizadorReenvio = setInterval(() => {

        segundosParaReenviar--;

        if (segundosParaReenviar <= 0) {
            pararContagemReenvio();
        } else {
            atualizarBotaoReenviar();
        }

    }, 1000);

}

function pararContagemReenvio() {

    clearInterval(temporizadorReenvio);
    segundosParaReenviar = 0;

    botaoReenviar.textContent = "Reenviar código";
    botaoReenviar.className = "ativo";

}

function atualizarBotaoReenviar() {

    botaoReenviar.textContent = "Aguarde " + segundosParaReenviar + "s";
    botaoReenviar.className = "contando";

}

// ----- Pedir o código -----

async function pedirCodigo() {

    limparErros();

    const email = campoUsuario.value.trim();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        mostrarErro("Digite seu e-mail no campo acima primeiro.", "usuario");
        return;
    }

    botaoReceberCodigo.disabled = true;

    try {

        const corpo = new URLSearchParams({ email: email });

        const resposta = await fetch("login/solicitar_codigo.php", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: corpo
        });

        const dados = await resposta.json();

        if (dados.sucesso) {

            abrirPainelCodigo();
            avisoCodigo.textContent = dados.mensagem || "Enviamos um código para o seu e-mail.";
            avisoCodigo.classList.add("visivel");
            iniciarContagemReenvio();

        } else {

            mostrarErro(dados.erro || "Não foi possível enviar o código.", dados.campo);

        }

    } catch (erro) {

        console.error("Erro ao pedir código:", erro);
        mostrarErro("Não foi possível se conectar ao servidor. Tente novamente.", null);

    } finally {

        botaoReceberCodigo.disabled = false;

    }

}

botaoReceberCodigo.addEventListener("click", pedirCodigo);

botaoReenviar.addEventListener("click", () => {
    if (segundosParaReenviar <= 0) pedirCodigo();
});

// ----- Verificar o código -----

async function verificarCodigo() {

    limparErros();

    const email = campoUsuario.value.trim();
    const codigo = campoCodigo.value.trim();

    if (codigo === '') {
        mostrarErro("Digite o código recebido por e-mail.", "codigo");
        return;
    }

    botaoVerificarCodigo.disabled = true;
    botaoVerificarCodigo.textContent = "Verificando...";

    try {

        const corpo = new URLSearchParams({ email: email, codigo: codigo });

        const resposta = await fetch("login/verificar_codigo.php", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: corpo
        });

        const dados = await resposta.json();

        if (dados.sucesso) {

            toastTexto.textContent = "Login realizado! Redirecionando...";
            mostrarToastERedirecionar();

        } else {

            mostrarErro(dados.erro || "Código incorreto.", dados.campo);
            botaoVerificarCodigo.disabled = false;
            botaoVerificarCodigo.textContent = "Verificar código";

        }

    } catch (erro) {

        console.error("Erro ao verificar código:", erro);
        mostrarErro("Não foi possível se conectar ao servidor. Tente novamente.", null);
        botaoVerificarCodigo.disabled = false;
        botaoVerificarCodigo.textContent = "Verificar código";

    }

}

botaoVerificarCodigo.addEventListener("click", verificarCodigo);

// ----- Login normal (e-mail + senha) -----

formLogin.addEventListener("submit", async (evento) => {

    evento.preventDefault();

    // Se o painel de código estiver aberto, o Enter não deve tentar logar com senha
    if (painelCodigo.classList.contains("visivel")) {
        verificarCodigo();
        return;
    }

    limparErros();

    const email = campoUsuario.value.trim();
    const senha = campoSenha.value;

    if (email === '' || senha === '') {
        mostrarErro("Preencha e-mail e senha.", null);
        return;
    }

    botaoLogar.disabled = true;
    botaoLogar.value = "Entrando...";

    try {

        const corpo = new URLSearchParams({ usuario: email, senha: senha });

        const resposta = await fetch("login/login-acao-nebula.php", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: corpo
        });

        const dados = await resposta.json();

        if (dados.sucesso) {

            toastTexto.textContent = "Login realizado! Redirecionando...";
            mostrarToastERedirecionar(dados.destino); // NOVO: destino vindo do PHP (aluno/professor/suporte)

        } else {

            mostrarErro(dados.erro || "Usuário ou senha incorretos.", dados.campo);
            botaoLogar.disabled = false;
            botaoLogar.value = "Logar";

        }

    } catch (erro) {

        console.error("Erro ao entrar:", erro);
        mostrarErro("Não foi possível se conectar ao servidor. Tente novamente.", null);
        botaoLogar.disabled = false;
        botaoLogar.value = "Logar";

    }

});

// ----- Voltou do Google com erro? (cancelou, ou algo falhou no servidor) -----
(function checarErroGoogle() {

    const parametros = new URLSearchParams(window.location.search);

    if (parametros.get("erro") === "google") {
        mostrarErro("Não foi possível entrar com o Google. Tente novamente.", null);
        // Limpa o ?erro=google da URL, pra não reaparecer se a pessoa der F5
        window.history.replaceState({}, document.title, window.location.pathname);
    }

})();
